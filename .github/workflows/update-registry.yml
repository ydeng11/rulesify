name: Update Registry

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Prod
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Save original registry before auto-generation
        run: cp registry.toml /tmp/registry-original.toml

      - run: cargo run --bin update-registry -- --verbose

      - name: Restore manually-added skills removed by auto-generator
        run: python3 .github/scripts/restore_skills.py /tmp/registry-original.toml registry.toml

      - name: Verify no skills lost
        run: python3 .github/scripts/verify_skills.py /tmp/registry-original.toml registry.toml

      - id: changes
        run: |
          git diff --quiet registry.toml && echo "has_changes=false" >> $GITHUB_OUTPUT
          git diff --quiet registry.toml || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Test generated registry
        if: steps.changes.outputs.has_changes == 'true'
        run: cargo test --all-features -- --test-threads=1

      - id: registry-pr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Weekly registry update"
          branch: "auto/registry-update"
          base: "main"
          add-paths: registry.toml
          commit-message: "chore: update registry"

      - name: Merge verified registry update
        if: steps.registry-pr.outputs.pull-request-number != '' && steps.registry-pr.outputs.pull-request-operation != 'closed'
        env:
          PR_NUMBER: ${{ steps.registry-pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.registry-pr.outputs.pull-request-head-sha }}
        run: |
          test -n "$PR_HEAD_SHA"
          test "$(gh pr view "$PR_NUMBER" --json headRefName,baseRefName,files --jq '.headRefName == "auto/registry-update" and .baseRefName == "main" and ([.files[].path] == ["registry.toml"])')" = "true"
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$PR_HEAD_SHA"
